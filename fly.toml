app = "parking-systems"
primary_region = "ams"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8501"

[processes]
  app = "python run_app.py" # تعريف مجموعة العمليات "app"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"] # ربط الخدمة بمجموعة العمليات "app"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  memory_mb = 1024

[mounts]
  source = "parking_data"
  destination = "/data"