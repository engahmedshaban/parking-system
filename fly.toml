app = "parking-systems"
primary_region = "ams" # أو المنطقة اللي اخترتها

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8501"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# ⭐⭐ ربط القرص الدائم عشان الداتا متتمسحش
[mounts]
  source = "parking_data"
  destination = "/data"