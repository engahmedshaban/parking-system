# fly.toml app configuration file generated for parking-system on 2026-11-08T23:22:48Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "parking-system"
primary_region = 'ams'

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8501"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# ⭐⭐ ربط القرص الدائم عشان الداتا متتمسحش

[mounts]
  source = "parking_data"
  destination = "/data"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024
